name: lessongen

services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_DATABASE: lesoongen
      MYSQL_USER: lesoongen
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/up.cmd to create .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/up.cmd to create .env}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24

  engine:
    build:
      context: ./paper4_pipeline
      args:
        LESSONGEN_BUILD_COMMIT: ${LESSONGEN_BUILD_COMMIT:-unknown}
        LESSONGEN_BUILD_DIRTY: ${LESSONGEN_BUILD_DIRTY:-unknown}
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Run scripts/up.cmd to create .env}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ENGINE_INTERNAL_TOKEN: ${ENGINE_INTERNAL_TOKEN:?Run scripts/up.cmd to create .env}
      PAPER4_BIND_HOST: 0.0.0.0
      PAPER4_CONFIG_PATH: /app/configs/deepseek_v4_flash.json
      PAPER4_WEB_STATE_ROOT: /data/engine-state
      PAPER4_ARTIFACTS_ROOT: /data/engine-artifacts
    volumes:
      - ${LESSONGEN_RUNTIME_ROOT:-./runtime/lessongen}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/internal/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24

  backend:
    build:
      context: ./web
      args:
        LESSONGEN_BUILD_COMMIT: ${LESSONGEN_BUILD_COMMIT:-unknown}
        LESSONGEN_BUILD_DIRTY: ${LESSONGEN_BUILD_DIRTY:-unknown}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/lesoongen?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: lesoongen
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/up.cmd to create .env}
      ENGINE_BASE_URL: http://engine:8001
      ENGINE_INTERNAL_TOKEN: ${ENGINE_INTERNAL_TOKEN:?Run scripts/up.cmd to create .env}
      LESSON_STORAGE_ROOT: /data/web-storage
      FRONTEND_ORIGIN: http://127.0.0.1:5173
    volumes:
      - ${LESSONGEN_RUNTIME_ROOT:-./runtime/lessongen}:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 5s
      timeout: 5s
      retries: 24

  frontend:
    build: ./web/frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  mysql_data:
